name: rozgar
description: "Rozgar - Job Portal Mobile Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_messaging: ^15.0.4
  firebase_performance: ^0.10.0+8
  firebase_crashlytics: ^4.1.3
  google_sign_in: ^6.2.2

  # State management
  get: ^4.6.6

  # Networking
  dio: ^5.4.0
  dio_cache_interceptor: ^3.4.4

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # File handling
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  flutter_image_compress: ^2.1.0
  flutter_pdfview: ^1.3.2
  permission_handler: ^11.3.0

  # Security
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Notifications
  flutter_local_notifications: ^16.3.0

  # Background tasks
  workmanager: ^0.5.2

  # Ads + IAP
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.1.13

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^5.0.2
  logger: ^2.3.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/lottie/
